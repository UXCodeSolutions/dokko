version: "3.9"

services:
  api:
    build: ./dokko-backend
    image: dokko-api:latest
    container_name: dokko-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./dokko-backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3